[pytest]
# ==================== ЛОГИРОВАНИЕ ====================
# Отключаем вывод логов в консоль при успехе
log_cli = false
log_cli_level = INFO

# Полные логи пишем в файл (для анализа при падении)
log_file = test-results/test_run.log
log_file_level = DEBUG
log_file_format = %(asctime)s | %(levelname)-7s | %(name)s | %(funcName)s:%(lineno)d | %(message)s

# ==================== БАЗОВЫЕ НАСТРОЙКИ ====================
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Пути к тестам
testpaths = integration_tests

# Паттерны поиска тестов
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# ==================== РЕГИСТРАЦИЯ МАРКЕРОВ ====================
# Убирает PytestUnknownMarkWarning и позволяет запускать группы тестов
markers =
    # Типы тестирования
    ui: UI (интерфейсные) тесты
    api: API тесты
    integration: Интеграционные тесты

    # Функциональные области
    filtering: Тесты фильтрации
    pagination: Тесты пагинации
    sorting: Тесты сортировки
    pagination_sorting: Комбинированные тесты пагинации и сортировки

    # Разделы системы
    products: Тесты раздела Продукты
    orders: Тесты раздела Заказы
    payments: Тесты раздела Платежи
    offers: Тесты раздела Предложения
    documents: Тесты раздела Документы
    notifications: Тесты раздела Уведомления
    statements: Тесты раздела Заявления

    # Приоритет и тип прогона
    smoke: Дымовые тесты (быстрый прогон критического функционала)
    regression: Тесты регрессии (полный прогон)
    slow: Медленные тесты (требуют больше времени)
    flaky: Нестабильные тесты (требуют внимания)

# ==================== ФИЛЬТРАЦИЯ ПРЕДУПРЕЖДЕНИЙ ====================
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnknownMarkWarning

# ==================== ТАЙМАУТЫ ====================
# Таймаут на выполнение одного теста (в секундах)
timeout = 120
timeout_method = thread

# ==================== ПАРАЛЛЕЛЬНЫЙ ЗАПУСК (xdist) ====================
# Если используется pytest-xdist, можно раскомментировать:
# addopts =
#     -v
#     --tb=short
#     -n auto
#     --dist=loadfile