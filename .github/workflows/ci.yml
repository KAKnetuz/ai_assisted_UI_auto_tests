name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: integration_tests/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r integration_tests/requirements.txt ruff==0.16.9

      - name: Ruff
        run: ruff check --config integration_tests/ruff.toml integration_tests

      - name: Framework unit tests
        run: pytest integration_tests/unit_tests -p no:cacheprovider

      - name: Collect integration tests
        run: pytest --collect-only -q -p no:cacheprovider
